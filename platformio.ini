; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F103C8

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
board_build.f_cpu = 64000000L
board_build.stm32cube.custom_config_header = yes
build_flags =
    -Wall
    -Wextra

; Explicit closed-loop preset-route build; same MCU and pin map.
[env:encoder_closed_loop]
extends = env:genericSTM32F103C8
build_flags =
    ${env:genericSTM32F103C8.build_flags}
    -DENCODER_CONTROL_ENABLED=1
    -DPRESET_ROUTE_ENABLED=1

; Closed-loop line following only, without preset turns or route STOP.
[env:encoder_line_only]
extends = env:genericSTM32F103C8
build_flags =
    ${env:genericSTM32F103C8.build_flags}
    -DENCODER_CONTROL_ENABLED=1
    -DPRESET_ROUTE_ENABLED=0
